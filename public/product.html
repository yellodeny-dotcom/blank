<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail — Maison Furniture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="shop">
  <div id="header-slot"></div>

  <div class="container">
    <div class="breadcrumb">
      <a href="/shop.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Shop
      </a>
    </div>
  </div>

  <div class="container" id="product-detail-container">
    <!-- Filled by JS -->
  </div>

  <!-- Related products -->
  <section class="section" id="related-section" style="display:none;">
    <div class="container">
      <h2 class="mb-6">You may also like</h2>
      <div class="product-grid" id="related-grid"></div>
    </div>
  </section>

  <div id="footer-slot"></div>
  <div id="cart-slot"></div>

  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    (function() {
      var id = Maison.getQueryParam('id');
      var product = Maison.getProductById(id);

      if (!product) {
        document.getElementById('product-detail-container').innerHTML =
          '<div class="text-center" style="padding:80px 24px;"><p class="text-xl semibold mb-3">Product not found</p><a href="/shop.html" class="btn btn-primary">Back to Shop</a></div>';
        return;
      }

      document.title = product.name + ' — Maison Furniture';

      var saveAmt = product.oldPrice ? product.oldPrice - product.price : 0;

      var html = '<div class="product-detail">' +
        '<div class="product-detail-img">' +
          '<img src="' + product.image + '" alt="' + product.name + '">' +
          (product.badge ? '<div style="position:absolute;top:16px;left:16px;">' + Maison.badgeHtml(product.badge) + '</div>' : '') +
        '</div>' +
        '<div class="product-detail-info">' +
          '<p class="eyebrow mb-2">' + product.category + '</p>' +
          '<h1>' + product.name + '</h1>' +
          '<div class="flex items-center gap-2 mb-4">' +
            Maison.starsHtml(product.rating) +
            '<span class="text-sm semibold">' + product.rating + '</span>' +
            '<span class="text-sm muted">(' + product.reviews + ' reviews)</span>' +
          '</div>' +
          '<div class="product-detail-price">' +
            '<span class="price">$' + product.price + '</span>' +
            (product.oldPrice ? '<span class="old-price">$' + product.oldPrice + '</span><span class="save">Save $' + saveAmt + '</span>' : '') +
          '</div>' +
          '<p class="product-detail-desc">' + product.desc + '</p>' +
          '<div class="qty-selector">' +
            '<button onclick="qtyChange(-1)">\u2212</button>' +
            '<span class="val" id="qty-val">1</span>' +
            '<button onclick="qtyChange(1)">+</button>' +
          '</div>' +
          '<button class="btn btn-primary btn-lg btn-block" id="add-to-cart-btn" onclick="addToCartWithQty(' + product.id + ')">' +
            '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>' +
            'Add to Cart' +
          '</button>' +
          '<div class="detail-features">' +
            '<div class="detail-feature"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg><p>Free shipping<br>over $99</p></div>' +
            '<div class="detail-feature"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg><p>30-day<br>easy returns</p></div>' +
            '<div class="detail-feature"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><p>5-year<br>warranty</p></div>' +
          '</div>' +
        '</div>' +
      '</div>';

      document.getElementById('product-detail-container').innerHTML = html;

      // Qty control
      var qty = 1;
      window.qtyChange = function(delta) {
        qty = Math.max(1, qty + delta);
        document.getElementById('qty-val').textContent = qty;
      };

      // Add to cart with qty
      window.addToCartWithQty = function(pid) {
        var p = Maison.getProductById(pid);
        if (!p) return;
        for (var i = 0; i < qty; i++) Maison.addToCart(pid);
      };

      // Related
      var related = Maison.PRODUCTS.filter(function(p) {
        return p.category === product.category && p.id !== product.id;
      }).slice(0, 4);

      if (related.length > 0) {
        document.getElementById('related-section').style.display = 'block';
        document.getElementById('related-grid').innerHTML = related.map(Maison.productCardHtml).join('');
      }
    })();
  </script>
</body>
</html>
