<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Furniture — Maison Furniture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="shop">
  <div id="header-slot"></div>

  <!-- Category bar -->
  <div class="category-bar">
    <div class="container" style="padding:0;">
      <div class="category-bar-inner" id="cat-bar"></div>
    </div>
  </div>

  <!-- Page header -->
  <div class="bg-surface" style="border-bottom:1px solid var(--line);">
    <div class="container" style="padding:40px 24px 32px;">
      <h1 id="page-title">All Furniture</h1>
      <p class="muted" id="page-count">68 items available</p>
    </div>
  </div>

  <!-- Shop -->
  <div class="container" style="padding:0;">
    <div class="shop-layout">
      <!-- Sidebar -->
      <aside class="shop-sidebar" id="shop-sidebar">
        <div class="shop-filters">
          <h3>Filters</h3>
          <div class="filter-group">
            <h4>Category</h4>
            <div class="filter-list" id="filter-categories"></div>
          </div>
          <div class="filter-group">
            <h4>Price Range</h4>
            <div class="filter-list">
              <label><input type="radio" name="price" value="all" checked> All prices</label>
              <label><input type="radio" name="price" value="0-500"> Under $500</label>
              <label><input type="radio" name="price" value="500-1000"> $500 - $1,000</label>
              <label><input type="radio" name="price" value="1000-2000"> $1,000 - $2,000</label>
              <label><input type="radio" name="price" value="2000-99999"> Over $2,000</label>
            </div>
          </div>
          <div class="filter-group">
            <h4>Special</h4>
            <div class="filter-list">
              <label><input type="checkbox" id="filter-sale"> On Sale only</label>
              <label><input type="checkbox" id="filter-new"> New Arrivals only</label>
            </div>
          </div>
        </div>
      </aside>

      <!-- Products -->
      <div>
        <div class="shop-controls">
          <button class="btn btn-outline btn-sm mobile-filter-toggle" id="filter-toggle">Filters</button>
          <div class="search-box">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" placeholder="Search products...">
          </div>
          <select id="sort-select">
            <option value="featured">Featured</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
            <option value="reviews">Most Reviewed</option>
          </select>
        </div>
        <div class="product-grid" id="product-grid"></div>
        <div id="no-results" class="text-center" style="padding:48px 0;display:none;">
          <p class="text-lg semibold mb-2">No products found</p>
          <p class="muted text-sm">Try a different search or filter.</p>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-slot"></div>
  <div id="cart-slot"></div>

  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    (function() {
      var P = Maison.PRODUCTS;
      var CATS = Maison.CATEGORIES;
      var state = { category: 'All', price: 'all', sale: false, isNew: false, search: '', sort: 'featured' };

      var urlCat = Maison.getQueryParam('cat');
      if (urlCat) state.category = urlCat;

      // Build category bar
      var catBar = document.getElementById('cat-bar');
      var allCats = ['All'].concat(CATS);
      catBar.innerHTML = allCats.map(function(c) {
        return '<a href="/shop.html' + (c !== 'All' ? '?cat=' + c : '') + '" class="cat-pill' + (c === state.category ? ' active' : '') + '">' + c + '</a>';
      }).join('');

      // Build sidebar filters
      var filterCats = document.getElementById('filter-categories');
      filterCats.innerHTML = ['All'].concat(CATS).map(function(c) {
        return '<label><input type="radio" name="cat" value="' + c + '"' + (c === state.category ? ' checked' : '') + '> ' + c + '</label>';
      }).join('');

      // Set page title
      document.getElementById('page-title').textContent = state.category === 'All' ? 'All Furniture' : state.category;

      function filterProducts() {
        var results = P.filter(function(p) {
          if (state.category !== 'All' && p.category !== state.category) return false;
          if (state.price !== 'all') {
            var parts = state.price.split('-');
            if (p.price < parseInt(parts[0]) || p.price > parseInt(parts[1])) return false;
          }
          if (state.sale && p.badge !== 'sale') return false;
          if (state.isNew && p.badge !== 'new') return false;
          if (state.search) {
            var q = state.search.toLowerCase();
            if (p.name.toLowerCase().indexOf(q) === -1 && p.category.toLowerCase().indexOf(q) === -1) return false;
          }
          return true;
        });

        switch (state.sort) {
          case 'price-low': results.sort(function(a,b) { return a.price - b.price; }); break;
          case 'price-high': results.sort(function(a,b) { return b.price - a.price; }); break;
          case 'rating': results.sort(function(a,b) { return b.rating - a.rating; }); break;
          case 'reviews': results.sort(function(a,b) { return b.reviews - a.reviews; }); break;
        }

        document.getElementById('page-count').textContent = results.length + (results.length === 1 ? ' item' : ' items') + ' available';
        var grid = document.getElementById('product-grid');
        var noRes = document.getElementById('no-results');
        if (results.length === 0) {
          grid.innerHTML = '';
          noRes.style.display = 'block';
        } else {
          noRes.style.display = 'none';
          grid.innerHTML = results.map(Maison.productCardHtml).join('');
        }
      }

      // Listeners
      filterCats.addEventListener('change', function(e) {
        if (e.target.name === 'cat') { state.category = e.target.value; filterProducts(); document.getElementById('page-title').textContent = state.category === 'All' ? 'All Furniture' : state.category; }
      });

      document.querySelectorAll('input[name="price"]').forEach(function(r) {
        r.addEventListener('change', function() { state.price = this.value; filterProducts(); });
      });

      document.getElementById('filter-sale').addEventListener('change', function() { state.sale = this.checked; filterProducts(); });
      document.getElementById('filter-new').addEventListener('change', function() { state.isNew = this.checked; filterProducts(); });
      document.getElementById('search-input').addEventListener('input', function() { state.search = this.value; filterProducts(); });
      document.getElementById('sort-select').addEventListener('change', function() { state.sort = this.value; filterProducts(); });

      var filterToggle = document.getElementById('filter-toggle');
      if (filterToggle) {
        filterToggle.addEventListener('click', function() {
          document.getElementById('shop-sidebar').classList.toggle('open');
        });
      }

      filterProducts();
    })();
  </script>
</body>
</html>
